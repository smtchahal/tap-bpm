name: CI/CD

# One run per change: PRs run on `pull_request`, and only merges to master run on `push`.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read # gitleaks lists the PR's commits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, security & build
    uses: smtchahal/actions-templates/.github/workflows/node-ci.yml@v2.0.0
    with:
      node-version: "24"
      fetch-depth: 0 # gitleaks scans history
      gitleaks: true
      audit: true
      # `pnpm build` runs `tsc -b` first, so it is also the type check.
      commands: |
        pnpm ci:lint
        pnpm knip
        pnpm test:run
        pnpm build
      artifact-name: dist
      artifact-path: dist

  validate:
    name: validate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: smtchahal/actions-templates/.github/workflows/cloudflare-deploy.yml@v2.0.0
    with:
      project-name: tap-bpm
      artifact-name: dist
      artifact-path: dist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
