name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    name: Lint, test, typecheck & build
    permissions:
      contents: read
      # gitleaks reads PR commits through the API
      pull-requests: read
    uses: smtchahal/actions-templates/.github/workflows/node-ci.yml@4e58cec172882f256066b093374f5da0c321c316 # v1.2.0
    with:
      node-version: "24"
      pnpm-version: "10"
      fetch-depth: 0
      gitleaks: true
      audit: true
      commands: |
        pnpm ci:lint
        pnpm knip
        pnpm test:run
        pnpm typecheck
        pnpm build
      artifact-name: dist
      artifact-path: dist

  validate:
    name: validate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
    uses: smtchahal/actions-templates/.github/workflows/cloudflare-deploy.yml@4e58cec172882f256066b093374f5da0c321c316 # v1.2.0
    with:
      project-name: tap-bpm
      artifact-name: dist
      artifact-path: dist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
